<header class="topo">
  <span class="marca">GAME<span class="destaque">STORE</span></span>

  <div class="acoes">
    @if (auth.usuario(); as usuario) {
      <span class="saudacao">Olá, {{ usuario.nome }}</span>
    }

    <button type="button" class="botao" (click)="carrinho.alternar()" aria-label="Abrir carrinho">
      Carrinho
      <span class="contador">{{ carrinho.quantidade() }}</span>
    </button>

    <button type="button" class="botao sair" (click)="sair()">Sair</button>
  </div>
</header>
